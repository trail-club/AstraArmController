; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = adafruit/Adafruit SSD1306@^2.5.10
monitor_speed = 921600
board_build.f_cpu = 240000000L
; upload_port / monitor_port は環境ごとに違うので固定しない。
;   - Linux: /dev/ttyUSB0
;   - macOS: /dev/cu.usbserial-0001
; 未指定なら PlatformIO が自動検出する。上書きしたい場合はコマンドラインか
; 環境変数 PLATFORMIO_UPLOAD_PORT / PLATFORMIO_MONITOR_PORT で渡す。
;   pio run -t upload --upload-port /dev/cu.usbserial-0001
;   PLATFORMIO_UPLOAD_PORT=/dev/cu.usbserial-0001 pio run -t upload
